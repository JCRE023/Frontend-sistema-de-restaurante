<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (loading()) {
        <div class="center">
          <mat-spinner diameter="40" />
        </div>
      } @else if (usuarios().length === 0) {
        <p class="hint">No hay usuarios en la base. Crea el primero.</p>
        <form [formGroup]="firstUserForm" (ngSubmit)="crearPrimero()" class="login-form">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="full">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="new-password" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="full">
            <mat-label>Rol</mat-label>
            <input matInput formControlName="rol" />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" class="submit-btn">Crear y entrar</button>
        </form>
      } @else {
        <form [formGroup]="loginForm" (ngSubmit)="ingresar()" class="login-form">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="full">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="clave" autocomplete="current-password" />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" class="submit-btn">Ingresar</button>
        </form>
      }
    </mat-card-content>
  </mat-card>
</div>
