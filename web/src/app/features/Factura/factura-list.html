<div class="page-header">
  <h2 class="page-title">Facturas</h2>
  <button mat-flat-button (click)="openCreate()">
    <mat-icon>add</mat-icon> Nueva factura
  </button>
</div>

<table mat-table [dataSource]="rows()" class="mat-elevation-z2 full-table">
  <ng-container matColumnDef="id_factura">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let r" class="uuid-cell">{{ r.id_factura | slice: 0 : 8 }}…</td>
  </ng-container>

  <ng-container matColumnDef="id_orden">
    <th mat-header-cell *matHeaderCellDef>Orden</th>
    <td mat-cell *matCellDef="let r" class="uuid-cell">{{ r.id_orden | slice: 0 : 8 }}…</td>
  </ng-container>

  <ng-container matColumnDef="total">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let r">{{ r.total | currency: 'COP' : 'symbol' : '1.0-0' }}</td>
  </ng-container>

  <ng-container matColumnDef="fecha_creacion">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let r">{{ r.fecha_creacion | date: 'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let r" class="actions-cell">
      <button mat-icon-button (click)="openEdit(r)" matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(r)" matTooltip="Eliminar">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let r; columns: cols"></tr>
  @if (rows().length === 0) {
    <tr class="mat-row">
      <td class="mat-cell empty-row" [attr.colspan]="cols.length">Sin registros</td>
    </tr>
  }
</table>
