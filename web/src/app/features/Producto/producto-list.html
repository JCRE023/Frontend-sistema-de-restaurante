<div class="page-header">
  <h2 class="page-title">Productos</h2>
  <button mat-flat-button (click)="openCreate()">
    <mat-icon>add</mat-icon> Nuevo producto
  </button>
</div>

<table mat-table [dataSource]="rows()" class="mat-elevation-z2 full-table">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="precio">
    <th mat-header-cell *matHeaderCellDef>Precio</th>
    <td mat-cell *matCellDef="let r">{{ r.precio | currency: 'COP' : 'symbol' : '1.0-0' }}</td>
  </ng-container>

  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef>Categoría</th>
    <td mat-cell *matCellDef="let r">{{ r.categoria }}</td>
  </ng-container>

  <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let r" class="desc-cell">{{ r.descripcion }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let r" class="actions-cell">
      <button mat-icon-button (click)="openEdit(r)" matTooltip="Editar">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(r)" matTooltip="Eliminar">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="cols"></tr>
  <tr mat-row *matRowDef="let r; columns: cols"></tr>
  @if (rows().length === 0) {
    <tr class="mat-row">
      <td class="mat-cell empty-row" [attr.colspan]="cols.length">Sin registros</td>
    </tr>
  }
</table>
