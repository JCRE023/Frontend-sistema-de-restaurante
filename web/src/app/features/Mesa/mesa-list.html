<div class="page-head">
    <h1>Mesas</h1>
    <button mat-flat-button color="primary" type="button" (click)="nuevo()">
        <mat-icon>add</mat-icon> Nueva mesa
    </button>
</div>

@if (loading) {
<div class="loading">
    <mat-spinner />
</div>
} @else {
<div class="table-wrap mat-elevation-z2">


    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id_mesa">
            <th mat-header-cell *matHeaderCellDef>ID mesa</th>
            <td mat-cell *matCellDef="let r">{{ r.id_mesa }}</td>
        </ng-container>

        <ng-container matColumnDef="numero_mesa">
            <th mat-header-cell *matHeaderCellDef>Numero de mesa</th>
            <td mat-cell *matCellDef="let r">{{ r.numero_mesa }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado de la mesa</th>
            <td mat-cell *matCellDef="let r">{{ r.estado }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let r" class="actions">
                <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>


    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
</div>
}
